name: Publish Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version to publish (e.g. 1.0.1)"
        required: true
        type: string
      channel:
        description: "Marketplace channel (default/eap)"
        required: false
        default: "default"
        type: string

jobs:
  publish:
    name: Sign and Publish
    runs-on: ubuntu-latest
    env:
      PLUGIN_VERSION: ${{ github.event.inputs.version }}
      PUBLISH_CHANNEL: ${{ github.event.inputs.channel }}
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build, sign, and publish
        run: ./gradlew clean verifyPlugin signPlugin publishPlugin --console=plain
