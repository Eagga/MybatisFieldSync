name: Publish Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version to publish (e.g. 1.0.1)"
        required: true
        type: string
      channel:
        description: "Marketplace channel (default/eap)"
        required: false
        default: "default"
        type: string

jobs:
  publish:
    name: Sign and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLUGIN_VERSION: ${{ github.event.inputs.version }}
      PUBLISH_CHANNEL: ${{ github.event.inputs.channel }}
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Validate required secrets
        run: |
          missing=0
          for key in PUBLISH_TOKEN CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Build, sign, and publish
        run: ./gradlew clean verifyPlugin signPlugin publishPlugin --console=plain
